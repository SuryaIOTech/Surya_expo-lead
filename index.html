.stat{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.stat{border-top:3px solid var(--gold)}.stat .n{font-size:28px;font-weight:800;color:var(--brand);line-height:1.1}.stat .l{font-size:12.5px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16201b;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 8px 28px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:var(--bad)}
.center{text-align:center}.mt{margin-top:12px}.mb0{margin-bottom:0}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.login .brandbox{text-align:center;margin-bottom:22px}.login .brandbox img{width:220px;max-width:70%;height:auto}.login .brandbox .tag2{margin-top:8px;color:var(--muted);font-size:13px;letter-spacing:.3px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:14px}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.spin{width:18px;height:18px;border:2.5px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.filters .span2{grid-column:1/-1}.filters input[type=date]{min-width:0}
.filters select,.filters input{padding:9px 10px;font-size:13.5px}
.callrow{display:flex;gap:8px;margin-top:10px}.callrow a{flex:1;text-decoration:none}
.inst{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;max-width:740px;margin:0 auto;background:#16201b;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center;font-size:14px}

.shareic{display:inline-block;width:16px;height:16px;vertical-align:-3px}
input[type=checkbox],input[type=radio]{accent-color:#11151e}
header.top .right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto;max-width:46%}

.sheet{position:fixed;inset:0;z-index:80;background:rgba(17,21,30,.45);display:flex;align-items:flex-end;justify-content:center}

.joblist{border:1px solid var(--line);border-radius:10px;padding:4px 10px;margin-top:8px;font-size:13.5px}.joblist>div{padding:6px 0;border-bottom:1px solid var(--line)}.joblist>div:last-child{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}

nav.tabs button{position:relative}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;font-style:normal;display:grid;place-items:center}
.tag.ns{background:#fff4d6;color:#7c4a03}
.lead .meta.fu{color:#11151e;font-weight:600}.lead .meta.fu.over{color:var(--bad)}.lead .meta.fu.tod{color:#8a5d00}
.chip.sm{padding:6px 11px;font-size:13px}
.duec{border-left:5px solid var(--gold)}
.stat.red{border-top-color:var(--bad)}.stat.red .n{color:var(--bad)}
h2.h-over{color:var(--bad)}
.bulk{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
:lang(hi) body,:lang(mr) body{line-height:1.55}

/* ===== Polish layer: type, icons, sync indicator ===== */

h1,h2,.btn,.stat .n,nav.tabs button span,.banner .t,.lead .nm,.sy-t,.syncbtn b,.avatar,.seg button{font-family:var(--disp)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.sheet{animation:fadein .160s ease-out}.sheet-in{animation:rise .220s cubic-bezier(.2,.8,.2,1);padding:8px 18px calc(20px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0}

.av{font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:.3px}
.stat{box-shadow:none;border:1px solid var(--line);border-top:1px solid var(--line);padding:13px 14px}

.bar .tr{height:8px}.bar{grid-template-columns:minmax(0,150px) 1fr 30px}.bar .v{font-family:var(--disp);font-weight:600}

nav.tabs button{padding:10px 4px 8px;font-size:11.5px}nav.tabs button.act{box-shadow:none;font-weight:600}
nav.tabs button.act:before{content:"";position:absolute;top:0;left:50%;width:26px;height:3px;margin-left:-13px;border-radius:0 0 3px 3px;background:var(--gold)}
.badge{top:5px;left:calc(50% + 5px);height:17px;min-width:17px;font:700 10.5px var(--disp);box-shadow:0 0 0 2px #fff}
.duec{border-left:1px solid var(--line);background:#fffaf0;border-color:#f3dfae}
.due-ic{flex:0 0 38px!important;width:38px;height:38px;border-radius:11px;background:var(--gold);color:#11151e;display:grid;place-items:center}.due-ic .ic{width:20px;height:20px}
.toast{background:#11151e;border-radius:11px;font-weight:550}
.pill{border-radius:7px}
.seg{border-radius:9px}.seg button{padding:6px 11px;font-size:13px}
.callrow .btn{gap:7px}
.btn{white-space:nowrap}.btn.sm{padding:7px 11px;gap:6px}
.card>.row.mt{flex-wrap:wrap}.card>.row.mt>.btn{flex:1 1 auto}

.hrow2{gap:10px;margin-bottom:4px}.hrow2 h2{flex:1}
.cardnote{display:none;align-items:center;gap:8px;font-size:13px;font-weight:550;border-radius:10px;padding:8px 11px;margin:8px 0 2px}
.cardnote .ic{width:16px;height:16px}
.cardnote.busy{display:flex;background:#f0f1f4;color:#3c4350}.cardnote.ok{display:flex;background:#fdf3dc;color:#6b4a00}.cardnote.warn{display:flex;background:var(--bad-soft);color:#8f1d13}
.spin.dark{width:15px;height:15px;border-color:#11151e33;border-top-color:#11151e}
input.i.fromcard{border-color:var(--gold);background:#fffbf1}
input.i.fromserver{border-color:#35c46b;background:#f3fbf6}
.cap{position:relative;margin-top:14px;border-radius:14px;overflow:hidden;background:#11151e;aspect-ratio:4/3}
.cap video{width:100%;height:100%;object-fit:cover;display:block}
.cap-guide{position:absolute;inset:12% 14%;border:2px solid var(--gold);border-radius:12px;box-shadow:0 0 0 999px rgba(17,21,30,.35)}

.seg.wide{display:flex;width:100%}.seg.wide button{flex:1;padding:10px 8px;font-size:14.5px}
.seg.wide button+button{border-left:1px solid var(--line)}
.tag.ct{background:#11151e;color:var(--gold)}

/* ============================== QR PARSER ==============================
   Exhibition badges vary. We accept: plain ID, URL (with ?id= etc.), JSON,
   vCard, MECARD, "key: value" lines, and delimited text like
   "V1023|Rahul Sharma|9876543210|rahul@x.com".                              */
const KEYMAP = {
  visitorId: ['ticketcode','ticket_code','ticketno','ticket_no','tc','id','visitorid','visitor_id','vid','uid','regno','reg_no','registrationno','registration_no','registrationid','registration_id','badge','badgeid','badge_id','barcode','code','ticket','ticketid','delegateid','attendeeid','attendee_id','regid'],
  name: ['name','fullname','full_name','visitorname','visitor_name','fn','customername','attendee'],
  mobile: ['mobile','phone','mob','mobileno','mobile_no','phoneno','phone_no','contact','contactno','tel','cell','whatsapp'],
  email: ['email','e-mail','mail','emailid','email_id'],
  jobTitle: ['designation','jobtitle','job_title','title','position','profession','occupation'],
  company: ['company','organisation','organization','org','firm','companyname','company_name','business','farm','farmname','farm_name'],
  country: ['country','nation','nationality']
};
const keyFor = k => { k = String(k).toLowerCase().replace(/[\s.]/g, ''); for (const f in KEYMAP) if (KEYMAP[f].includes(k) || KEYMAP[f].includes(k.replace(/-/g,'_'))) return f; return null; };

const fmtMob = m => { const raw = String(m || '').trim(); if (!raw) return ''; const d = raw.replace(/\D/g, '');
  if (d.length === 10 && /^[6-9]/.test(d)) return '(+91) ' + d; if (d.length === 12 && d.startsWith('91')) return '(+91) ' + d.slice(2); return raw.replace(/\s+/g, ' '); };

function shortHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return 'QR-' + (h >>> 0).toString(36).toUpperCase(); }

function parseQR(raw) {
  const text = String(raw || '').trim();
  const o = { visitorId: '', name: '', jobTitle: '', company: '', country: '', mobile: '', email: '', url: '', raw: text, format: 'id' };
  const put = (k, v) => { const f = keyFor(k); if (f && v != null && String(v).trim() && !o[f]) o[f] = String(v).trim(); };

  if (/^[\[{]/.test(text)) {
    try { let j = JSON.parse(text); if (Array.isArray(j)) j = j[0] || {}; const walk = (x) => { for (const k in x) { if (x[k] && typeof x[k] === 'object') walk(x[k]); else put(k, x[k]); } }; walk(j); o.format = 'json'; } catch {}
  } else if (/^BEGIN:VCARD/i.test(text)) {
    o.format = 'vcard';
    text.split(/\r?\n/).forEach(l => {
      const m = l.match(/^([A-Z-]+)[^:]*:(.*)$/i); if (!m) return; const k = m[1].toUpperCase(), v = m[2].trim();
      if (k === 'FN') o.name = o.name || v;
      else if (k === 'N' && !o.name) o.name = v.split(';').filter(Boolean).reverse().join(' ');
      else if (k === 'TEL') o.mobile = o.mobile || v;
      else if (k === 'EMAIL') o.email = o.email || v;
      else if (k === 'TITLE') o.jobTitle = o.jobTitle || v;
      else if (k === 'ORG') o.company = o.company || v.replace(/;/g, ' ');
      else if (k === 'ADR') o.country = o.country || (v.split(';')[6] || '');
      else if (k === 'UID' || k === 'NOTE' && /id/i.test(v)) o.visitorId = o.visitorId || v;
    });
  } else if (/^MECARD:/i.test(text)) {
    o.format = 'mecard';
    text.replace(/^MECARD:/i, '').split(';').forEach(p => {
      const i = p.indexOf(':'); if (i < 0) return; const k = p.slice(0, i).toUpperCase(), v = p.slice(i + 1);

    });

    o.format = 'url'; o.url = text;

    o.format = 'delimited';
    const parts = text.split(/[|\t;]|,(?=\s*\S)/).map(s => s.trim()).filter(Boolean);
    parts.forEach((p, i) => {
      if (!o.email && EMAIL_RE.test(p)) o.email = p.match(EMAIL_RE)[0];
      else if (!o.mobile && /^[+\d][\d\s-]{8,}$/.test(p)) o.mobile = p;
      else if (i === 0 && /\d/.test(p) && !/\s/.test(p)) o.visitorId = p;
      else if (!o.name && /^[A-Za-z][A-Za-z .']{1,60}$/.test(p)) o.name = p;
      else if (!o.company && /[A-Za-z]/.test(p)) o.company = p;
    });
  }
  // Fallback: sniff email / phone anywhere in the text
  if (!o.email) { const m = text.match(EMAIL_RE); if (m) o.email = m[0]; }
  if (!o.mobile && o.format !== 'id' && o.format !== 'url') { const m = text.match(PHONE_RE); if (m) o.mobile = m[0]; }
  if (o.mobile) o.mobile = fmtMob(o.mobile);
  if (!o.visitorId) o.visitorId = o.format === 'id' ? text : (o.mobile ? 'M-' + normMob(o.mobile) : shortHash(text));
  if (o.visitorId.length > 120) o.visitorId = shortHash(o.visitorId);
  return o;
}

/** Reads the card and fills the empty name / company / country fields on the open customer screen. */
async function readCardInto(pic, leadId) {
  if (!S.view || !S.view.lead || S.view.lead.leadId !== leadId) return;
  S.view.reading = true; S.view.cardMsg = ''; updateCardNote();
  let r = null, failed = false;
  try { r = await CardReader.read(pic); } catch (e) { failed = true; }
  if (!S.view || !S.view.lead || S.view.lead.leadId !== leadId) return;
  S.view.reading = false;
  if (failed) { S.view.cardMsg = 'load'; return updateCardNote(); }
  if (r && r.noQR) { S.view.cardMsg = 'noqr'; return updateCardNote(); }
  if (!r || !r.name) { S.view.cardMsg = 'none'; return updateCardNote(); }
  S.view.card = r; S.view.cardMsg = 'ok';
  [['name', r.name], ['jobTitle', r.jobTitle], ['company', r.company], ['country', r.country]].forEach(([k, v]) => {
    const el = $('#e_' + k); if (!el || el.readOnly || !v) return;
    if (!el.value.trim() || el.dataset.fromCard) { el.value = v; el.dataset.fromCard = '1'; el.classList.remove('need'); el.classList.add('fromcard'); const w = el.parentElement.querySelector('.needtxt'); if (w) w.remove(); }
  });
  updateCardNote();
  if (S.view.retype) S.view.retype();
}
function updateCardNote() {
  const n = $('#cardnote'); if (!n || !S.view) return;

let qr = null, lastCode = '', lastAt = 0, busy = false;
async function startScanner() {
  const el = $('#reader'); if (!el) return;
  if (!window.Html5Qrcode) { el.innerHTML = `<div class="scanph">${t('Camera scanner could not load (no internet?).')}<br>${t('Use the handheld scanner box or manual entry below.')}</div>`; return; }
  try {
    if (qr) { try { await qr.stop(); } catch {} qr.clear(); }
    el.innerHTML = '';
    qr = new Html5Qrcode('reader', { verbose: false });
    await qr.start({ facingMode: 'environment' },
      { fps: 12, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.72); return { width: s, height: Math.floor(s * 0.85) }; }, aspectRatio: 1.15 },
      code => onCode(code), () => {});
  } catch (e) {
    el.innerHTML = `<div class="scanph">${t('Camera not available.')}<br><span class="small">${esc(e && e.message || e)}</span><br><br>${t('Allow camera permission in your browser, or use the handheld scanner box / manual entry below.')}<br><br><button class="btn sm ghost" onclick="startScanner()">${t('Try again')}</button></div>`;
  }
}
async function stopScanner() { if (qr) { try { await qr.stop(); } catch {} try { qr.clear(); } catch {} qr = null; } }

async function onCode(code) {
  const now = Date.now();
  if (busy || (code === lastCode && now - lastAt < 4000)) return;
  lastCode = code; lastAt = now;
  let pic = null; try { pic = CardReader.snap(); } catch {}
  await processScan(parseQR(code), false, pic);
}

async function processScan(parsed, manual, pic) {
  if (busy) return; busy = true;
  const data = { ...parsed, manual, event: SET().activeEvent, leadId: uuid(), time: new Date().toISOString() };
  try {
    const res = offlineScan(data);                    // instant: duplicate check on this phone; the upload runs in the background
    res.offline = !isOnline();
    cacheLead(res.lead);
    beep(res.status === 'new');
    await stopScanner();
    ['name', 'jobTitle', 'company', 'country', 'email'].forEach(k => { if (isJunk(res.lead[k])) res.lead[k] = ''; });
    S.view = { type: 'lead', lead: res.lead, status: res.status, offline: !!res.offline, parsed, autoFilled: false,
      fetching: !!(data.url && isOnline() && S.server !== 'demo' && res.status === 'new' && !res.lead.email) };
    if (S.server === 'demo' && !pic && !manual && !res.lead.name) pic = 'demo';
    const readIt = pic && !manual && !res.lead.name;
    if (readIt) S.view.reading = true;
    render();
    if (readIt) readCardInto(pic, res.lead.leadId);
    syncQueue();
  } catch (e) { beep(false); toast(e.message, true); }
  finally { busy = false; }
}

function offlineScan(data) {
  const ev = data.event, vid = String(data.visitorId || '').toLowerCase(), mob = normMob(data.mobile);
  const l = S.leads.find(x => x.event === ev && ((vid && String(x.visitorId).toLowerCase() === vid) || (mob.length === 10 && normMob(x.mobile) === mob)));
  S.queue.push({ action: 'scan', data, at: data.time }); saveQueue();
  if (l) {
    const u = { ...l, lastScan: data.time, lastBy: me().name, repeatCount: (l.repeatCount || 0) + 1 };
    return { status: 'existing', lead: u, offline: true };
  }
  return { status: 'new', offline: true, lead: { leadId: data.leadId, visitorId: data.visitorId || (data.mobile ? 'M-' + normMob(data.mobile) : 'MAN-' + data.leadId.slice(0, 8).toUpperCase()), source: data.manual ? 'Manual Entry' : 'Scanned',
    name: data.name || '', jobTitle: data.jobTitle || '', company: data.company || '', country: data.country || '', mobile: fmtMob(data.mobile), email: data.email || '', url: data.url || '', event: ev,
    firstScan: data.time, lastScan: data.time, firstBy: me().name, lastBy: me().name, interests: '', notes: '', repeatCount: 0, status: 'New Lead', consent: !!data.consent, assignedTo: '', followUp: '' } };
}

  if (!isOnline()) return { k: 'offline', cls: 'off', icon: I.cloudOff, n: q, label: q ? t('Offline · {n} pending', { n: q }) : t('Offline'), title: t('You are offline'),
    bar: q ? t('Offline. {n} saved on this phone.', { n: q }) : t('Offline. Scans are saved on this phone.'), act: t('Details') };
  if (f) return { k: 'failed', cls: 'bad', icon: I.cloudAlert, n: f, label: t('{n} not saved', { n: f }), title: t('Changes not saved: {n}', { n: f }), bar: t('Changes not saved: {n}', { n: f }), act: t('Review') };
  if (q && q < 5 && S.lastQueueAt && Date.now() - S.lastQueueAt < 20000) return { k: 'syncing', cls: 'sy', icon: I.cloudUp, n: q, label: t('Syncing… {n}', { n: q }), title: t('Uploading…'), bar: '' };

}

const NOFILTER = () => ({ q: '', interest: '', status: '', member: '', from: '', to: '', type: '', event: '', source: '', assigned: '', ctype: '' });
function filtered() {
  const f = S.filters, q = f.q.toLowerCase();
  return S.leads.filter(l =>
    (!f.event || l.event === f.event) &&
    (!q || [l.name, l.jobTitle, l.company, l.country, l.mobile, l.email, l.visitorId, l.notes, l.assignedTo, l.customerType].join(' ').toLowerCase().includes(q)) &&
    (!f.interest || splitInt(l.interests).includes(f.interest)) &&
    (!f.status || (l.status || 'New Lead') === f.status) &&
    (!f.member || l.firstBy === f.member || l.lastBy === f.member) &&
    (!f.source || (l.source || 'Scanned') === f.source) &&
    (!f.ctype || (f.ctype === '__none' ? !l.customerType : l.customerType === f.ctype)) &&
    (!f.assigned || (f.assigned === '__none' ? !l.assignedTo : l.assignedTo === f.assigned)) &&
    (!f.type || (f.type === 'repeat' ? l.repeatCount > 0 : !l.repeatCount)) &&
    (!f.from || String(l.lastScan).slice(0, 10) >= f.from) &&
    (!f.to || String(l.firstScan).slice(0, 10) <= f.to));
}

        <select class="i" data-f="event">${opt(events, f.event, t('All events'))}</select>

    </div>
    <div class="card" id="list"></div>`;
  const draw = () => { const L = filtered(), ps = pendingSet(); $('#list').innerHTML = `<div class="small muted">${t('Customers: {n}', { n: L.length })}</div>` + (L.length ? L.map(l => leadRow(l, ps)).join('') : `<div class="empty">${t('No customers match.')}</div>`); bindLeadRows(m); };
  $('#fq').oninput = e => { f.q = e.target.value; draw(); };
  m.querySelectorAll('[data-f]').forEach(s => s.onchange = e => { f[s.dataset.f] = e.target.value; draw(); });
  $('#clr').onclick = () => { S.filters = NOFILTER(); leadsView(m); };
  $('#rf').onclick = async () => { $('#rf').disabled = true; if (await refreshLeads()) toast('Up to date'); leadsView(m); };

  const ba = $('#ba_go'); if (ba) ba.onclick = async () => {
    const L = filtered(), who = $('#ba_who').value; if (!L.length) return toast('No customers match.', true);
    if (!confirm(who ? t('Assign {n} customers to {who}?', { n: L.length, who }) : t('Remove the assignment from {n} customers?', { n: L.length }))) return;
    ba.disabled = true;
    try { const r = await api('assignMany', { data: { leadIds: L.map(l => l.leadId), assignedTo: who } }); r.leads.forEach(cacheLead); toast(t('Assigned: {n}', { n: r.leads.length })); leadsView(m); }
    catch (e) { toast(isNet(e) ? 'Assigning many customers needs internet' : e.message, true); ba.disabled = false; }
  };
  draw();

function exportExcel(leads, name) {
  const ts = iso => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return String(iso); const z = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; };
  const rows = leads.map(l => ({
    'scanned_by': l.firstBy, 'source': l.source || 'Scanned', 'name': l.name, 'job_title': l.jobTitle, 'email': l.email, 'contact_no': l.mobile, 'url': l.url,
    'scan_date': ts(l.firstScan), 'company': l.company || '', 'country': l.country || '', 'event': l.event, 'interests': l.interests, 'notes': l.notes, 'follow_up_status': l.status,
    'repeat_scans': l.repeatCount, 'last_scan': ts(l.lastScan), 'last_scanned_by': l.lastBy, 'assigned_to': l.assignedTo || '', 'follow_up_date': l.followUp || '', 'customer_type': l.customerType || ''
  }));
  const fn = name + '_' + new Date().toISOString().slice(0, 10);
  if (window.XLSX) {
    const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = Object.keys(rows[0] || { a: 1 }).map(k => ({ wch: Math.min(40, Math.max(12, k.length + 2)) }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Customers'); XLSX.writeFile(wb, fn + '.xlsx');
  } else {
    const cols = Object.keys(rows[0] || {}); const csv = [cols.join(',')].concat(rows.map(r => cols.map(c => '"' + String(r[c] ?? '').replace(/"/g, '""') + '"').join(','))).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = fn + '.csv'; a.click();
  }
  toast(t('Exported: {n}', { n: rows.length }));
}

/* ---------- Follow-ups ---------- */
function fuView(m) {

  g.over.sort((a, b) => a.followUp.localeCompare(b.followUp)); g.later.sort((a, b) => a.followUp.localeCompare(b.followUp));

  m.innerHTML = `

      <div class="stat"><div class="n">${g.today.length}</div><div class="l">${t('Due today')}</div></div>
      <div class="stat"><div class="n">${g.later.length + g.none.length}</div><div class="l">${t('Upcoming')}</div></div>
    </div>
    ${sec(t('Overdue'), g.over, 'h-over')}${sec(t('Due today'), g.today)}${sec(t('Upcoming'), g.later)}${sec(t('No follow-up date'), g.none)}
    ${all.length ? '' : `<div class="card"><div class="empty">${who === mine ? t('No customers are assigned to you yet.') : t('No follow-ups here.')}</div></div>`}
    <p class="small muted center">${t('Closed customers (Order Confirmed / Not Interested) are not shown.')}</p>`;
  const w = $('#fu_who'); if (w) w.onchange = () => { S.fuWho = w.value; fuView(m); };
  const un = $('#fu_un'); if (un) un.onclick = () => { S.filters = { ...NOFILTER(), assigned: '__none' }; go('leads'); };
  bindLeadRows(m);
  if (!m.dataset.loaded) { m.dataset.loaded = 1; refreshLeads().then(ok => { if (ok && S.tab === 'fu' && !S.view) fuView(m); }); }
}

  const drawUsers = users => {
    $('#ulist').innerHTML = `<table class="t"><tr><th>${t('Name')}</th><th>${t('Username')}</th><th>${t('Role')}</th><th></th></tr>${users.map(u => `<tr style="${u.active ? '' : 'opacity:.5'}"><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${u.role === 'admin' ? t('Admin') : t('Member')}${u.active ? '' : ' (' + t('off') + ')'}</td><td style="text-align:right"><button class="btn line sm" data-u="${esc(u.username)}">${t('Edit')}</button></td></tr>`).join('')}</table>`;
    $('#ulist').querySelectorAll('[data-u]').forEach(b => b.onclick = () => { const u = users.find(x => x.username === b.dataset.u);
      $('#u_un').value = u.username; $('#u_un').readOnly = true; $('#u_nm').value = u.name; $('#u_rl').value = u.role; $('#u_ac').checked = u.active; $('#u_pw').value = '';
      $('#uft').textContent = t('Edit') + ': ' + u.name; $('#u_pwh').textContent = '(' + t('leave blank to keep') + ')'; $('#u_nm').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
  };
  bindAccount();
  try { const us = (await api('users')).users; S.team = us; LS.set('surya_team', us); drawUsers(us); } catch (e) { $('#ulist').innerHTML = `<div class="empty">${esc(t(e.message))}</div>`; }
}

function accountCard() {
  const n = S.queue.length + S.failed.length;
  return `<div class="card"><h2>${t('My account')}</h2>
    <p class="small muted" style="margin-top:-4px">${esc(me().name)} · ${esc(me().username)} · ${isAdmin() ? t('Admin') : t('Team member')}</p>
    <label class="f">${t('Language')}</label>${langSwitch('ac_lang')}
    <div class="grid2"><div><label class="f">${t('Current password')}</label><input class="i" id="cp_o" type="password"></div><div><label class="f">${t('New password')}</label><input class="i" id="cp_n" type="password"></div></div>
    <button class="btn ghost block mt" id="cp">${t('Change password')}</button>
    <button class="btn line block mt" id="sync">${t('Sync status')}${n ? ' · ' + n : ''}</button>
    ${n ? `<p class="small" style="color:var(--warn)">${t("Changes waiting to sync: {n}. Don't log out until they sync.", { n })}</p>` : ''}
    <button class="btn line block mt" id="lo">${t('Log out')}</button>
    <p class="small muted center">${t('Server')}${S.session && S.session.version ? ' v' + esc(S.session.version) : (S.server === 'demo' ? '' : ' ' + t('(older version)'))}: ${S.server === 'demo' ? t('Demo mode (this phone only)') : esc(S.server.replace(/^https:\/\/script\.google\.com\/macros\/s\/(.{8}).*$/, 'Google Sheet ($1…)'))}</p>
    ${S.server === 'demo' ? `<button class="btn danger block sm" id="dreset">${t('Reset demo data')}</button>` : ''}</div>`;
}
function bindAccount() {
  $('#cp').onclick = async () => { try { await api('changePassword', { oldPassword: $('#cp_o').value, newPassword: $('#cp_n').value }); toast('Password changed'); $('#cp_o').value = $('#cp_n').value = ''; } catch (e) { toast(e.message, true); } };
  $('#lo').onclick = async () => {
    if (S.queue.length && !confirm(t('You have unsynced offline scans. Log out anyway? (They stay on this phone and sync after next login.)'))) return;
    try { await api('logout'); } catch {} logoutLocal();
  };
  $('#sync').onclick = openSync;
  bindLang('ac_lang');
  const dr = $('#dreset'); if (dr) dr.onclick = () => { if (confirm(t('Reset all demo data?'))) { Demo.reset(); LS.del('surya_leads_cache'); S.leads = []; S.queue = []; S.failed = []; saveQueue(); LS.set('surya_failed', []); logoutLocal(); } };
}
function meView(m) { m.innerHTML = accountCard(); bindAccount(); }

/* ============================== INSTALL AS APP ==============================
   Android/Chrome: shows an "Install" button using the browser's install prompt.
   iPhone/iPad: Apple has no install prompt, so we show a one-time tip instead. */
const Install = (() => {
  const standalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const iosSafari = isIOS && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//i.test(navigator.userAgent);
  let deferred = null;
  const SHARE = '<svg class="shareic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M8 7l4-4 4 4M5 11v9h14v-9"/></svg>';
  function hide(remember) { document.querySelectorAll('.inst').forEach(e => e.remove()); if (remember) LS.set('surya_install_dismissed', Date.now()); }
  function dismissedRecently() { const t = LS.get('surya_install_dismissed', 0); return t && Date.now() - t < 3 * 864e5; }   // ask again after 3 days
  function show(html, cls) {
    hide(false);
    const d = document.createElement('div'); d.className = 'inst ' + (cls || '') + (document.querySelector('nav.tabs') ? '' : ' nonav');
    d.innerHTML = `<img src="icons/icon-192.png" alt=""><div style="flex:1">${html}</div><button class="x" aria-label="Close">×</button>`;
    d.querySelector('.x').onclick = () => hide(true);
    document.body.appendChild(d); return d;
  }
  function maybeShow() {
    if (standalone() || dismissedRecently()) return;
    if (deferred) {
      const d = show(`<b>${t('Install SuryaIOTech Leads')}</b><div class="small" style="opacity:.8">${t('Opens full-screen, works offline')}</div>`);
      const b = document.createElement('button'); b.className = 'btn'; b.textContent = t('Install');
      b.onclick = async () => { hide(false); deferred.prompt(); const r = await deferred.userChoice; deferred = null; if (r.outcome !== 'accepted') LS.set('surya_install_dismissed', Date.now()); };
      d.insertBefore(b, d.querySelector('.x'));
    } else if (iosSafari) {
      show(`<b>${t('Install on your iPhone')}</b><div class="small" style="opacity:.9;margin-top:2px">${t('Tap {icon} Share below, then Add to Home Screen', { icon: SHARE })}</div>`, 'ios');
    } else if (isIOS) {
      show(`<b>${t('Install on your iPhone')}</b><div class="small" style="opacity:.9;margin-top:2px">${t('Open this link in Safari, then Share → Add to Home Screen')}</div>`);
    }
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; setTimeout(maybeShow, 1500); });
  window.addEventListener('appinstalled', () => { hide(false); toast('Installed ✓  Open Surya Leads from your home screen'); });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  return { maybeShow, isIOS, standalone };
})();

/* ============================== BOOT ============================== */
render();
setTimeout(Install.maybeShow, 2500);
if (S.session) { api('me').then(r => { S.session.user = r.user; S.session.settings = r.settings; S.session.version = r.version || ''; LS.set('surya_session', S.session); if (!S.view && S.tab !== 'scan') render(); else renderHeader(); afterLogin(); }).catch(() => {}); }
</script>
</body>
